services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: planeja_se
      POSTGRES_USER: planeja
      POSTGRES_PASSWORD: planeja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planeja -d planeja_se"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
